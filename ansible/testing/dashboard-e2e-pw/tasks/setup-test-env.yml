# Prepare the Playwright test environment: clone dashboard-e2e-pw, copy CI
# files (Dockerfile.ci, playwright.sh) into the clone, create Rancher users,
# encode SSH keys for the custom-node helper, build the Docker image, and
# generate the .env file.
#
# Self-contained — does NOT share files with ansible/testing/dashboard-e2e/.

- name: Wait for Dashboard UI
  ansible.builtin.uri:
    url: "https://{{ rancher_host }}/dashboard/auth/login"
    validate_certs: false
    status_code: 200
  register: dashboard_check
  until: dashboard_check.status == 200
  retries: 30
  delay: 10

- name: Detect dashboard-e2e-pw target branch
  ansible.builtin.set_fact:
    target_branch: >-
      {%- if dashboard_pw_branch is defined and dashboard_pw_branch and dashboard_pw_branch != 'main' -%}
        {{ dashboard_pw_branch }}
      {%- elif rancher_image_tag == 'head' -%}
        main
      {%- elif rancher_image_tag is match('^v(\d+\.\d+)') -%}
        release-{{ rancher_image_tag | regex_replace('^v(\d+\.\d+).*$', '\1') }}
      {%- else -%}
        {{ dashboard_pw_branch | default('main') }}
      {%- endif -%}

- name: Show detected branch
  ansible.builtin.debug:
    msg: "rancher_image_tag={{ rancher_image_tag }} → target_branch={{ target_branch }}"

- name: Remove old dashboard-e2e-pw checkout
  ansible.builtin.file:
    path: "{{ dashboard_dir }}"
    state: absent

- name: Show clone target
  ansible.builtin.debug:
    msg: "Cloning {{ dashboard_pw_repo }} @ {{ target_branch }}"

- name: Clone dashboard-e2e-pw repo
  ansible.builtin.git:
    repo: "https://github.com/{{ dashboard_pw_repo | regex_replace('\\.git$', '') }}.git"
    dest: "{{ dashboard_dir }}"
    version: "{{ target_branch }}"
    depth: 1
  retries: 3
  delay: 10
  register: _git_clone
  until: _git_clone is success

- name: Ensure jenkins/ subdir exists in the clone
  ansible.builtin.file:
    path: "{{ dashboard_dir }}/jenkins"
    state: directory
    mode: "0755"

- name: Copy CI files from playbook into dashboard-e2e-pw checkout
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ dashboard_dir }}/{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - { src: "{{ playbook_dir }}/files/Dockerfile.ci", dest: "jenkins/Dockerfile.ci" }
    - { src: "{{ playbook_dir }}/files/playwright.sh", dest: "jenkins/playwright.sh", mode: "0755" }
  loop_control:
    label: "{{ item.dest }}"

- name: Configure Rancher users and role bindings
  ansible.builtin.include_role:
    name: rancher_user_setup
  vars:
    rancher_admin_password: "{{ rancher_password }}"
    # Fail fast if tests need standard_user but login failed; warn-only otherwise
    rancher_user_on_error: "{{ 'fail' if '@standardUser' in pw_grep_tags else 'warn' }}"
    rancher_users:
      - username: standard_user
        password: "{{ rancher_password }}"
        global_roles:
          - user
        project_roles:
          - role: project-member
            project: Default
            cluster: local

- name: Handle imported kubeconfig from provision
  when: create_initial_clusters | bool
  block:
    - name: Check kubeconfig exists
      ansible.builtin.stat:
        path: "{{ outputs_dir }}/kubeconfig-import.yaml"
      register: _kubeconfig_file

    - name: Encode import kubeconfig to base64
      ansible.builtin.slurp:
        src: "{{ outputs_dir }}/kubeconfig-import.yaml"
      register: import_kubeconfig_b64
      when: _kubeconfig_file.stat.exists

    - name: Set kubeconfig variables
      ansible.builtin.set_fact:
        imported_kubeconfig: "{{ import_kubeconfig_b64.content }}"
      when: _kubeconfig_file.stat.exists

    - name: Write imported_config for Docker
      ansible.builtin.copy:
        content: "{{ import_kubeconfig_b64.content | b64decode }}"
        dest: "{{ dashboard_dir }}/imported_config"
        mode: "0600"
      when: _kubeconfig_file.stat.exists

    - name: Warn if kubeconfig missing
      ansible.builtin.debug:
        msg: >-
          kubeconfig-import.yaml not found — import cluster tests will be
          skipped. Run with --tags provision to create import clusters.
      when: not _kubeconfig_file.stat.exists

- name: Remove kubeconfig lines when no import cluster
  when: not (create_initial_clusters | bool) or (_kubeconfig_file is defined and not _kubeconfig_file.stat.exists)
  block:
    - name: Strip kubectl from playwright.sh
      ansible.builtin.lineinfile:
        path: "{{ dashboard_dir }}/jenkins/playwright.sh"
        regexp: "kubectl"
        state: absent

    - name: Strip imported_config from Dockerfile.ci
      ansible.builtin.lineinfile:
        path: "{{ dashboard_dir }}/jenkins/Dockerfile.ci"
        regexp: "imported_config"
        state: absent

- name: Set custom node key from SSH key file
  when:
    - create_initial_clusters | bool
    - custom_node_key is not defined
    - ssh_key is defined
  block:
    - name: Read and base64-encode SSH private key
      ansible.builtin.slurp:
        src: "{{ ssh_key }}"
      register: ssh_key_content

    - name: Set custom_node_key fact
      ansible.builtin.set_fact:
        custom_node_key: "{{ ssh_key_content.content }}"

- name: Verify CI files exist before Docker build
  ansible.builtin.shell: |
    set -e
    cd {{ dashboard_dir }}
    missing=""
    for f in package.json yarn.lock playwright.config.jenkins.ts jenkins/playwright.sh jenkins/Dockerfile.ci; do
      [ -f "$f" ] || missing="${missing} ${f}"
    done
    if [ -n "${missing}" ]; then
      echo "[verify] ERROR: Missing files before Docker build:${missing}"
      exit 1
    fi
    echo "[verify] OK — key files present"
  changed_when: false

- name: Show Docker build args
  ansible.builtin.debug:
    msg: "Building dashboard-pw-test image — playwright_image={{ playwright_image }}"

- name: Build dashboard-pw-test Docker image
  ansible.builtin.shell: |
    set -e
    docker build \
      --pull \
      -t dashboard-pw-test:{{ executor_tag }} \
      -f "{{ dashboard_dir }}/jenkins/Dockerfile.ci" \
      --build-arg PLAYWRIGHT_IMAGE="{{ playwright_image }}" \
      "{{ dashboard_dir }}"
  changed_when: true

- name: Generate .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ workspace_dir }}/.env"
    mode: "0644"

- name: Warn — qase_enabled is true but QASE_TOKEN is not set
  ansible.builtin.debug:
    msg: >-
      WARNING: qase_enabled is true but QASE_TOKEN is not set.
      Test results will NOT be reported to Qase.
      Export QASE_TOKEN in your environment before running (do not put the token in vars.yaml).
  when: (qase_enabled | default(false)) and (qase_token | default('') | length == 0)
